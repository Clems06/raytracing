[package]
name = "raytracing"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
winit = "0.30.9"
wgpu = "23.0.1"
env_logger = "0.10"
tokio = { version = "1.0", features = ["full"] }
bytemuck = { version = "1.0", features = ["derive"] }
futures-channel = "0.3.31"
tobj = "4.0.3"
gltf = "1.4.1"
derive-new = "0.7.0"
egui = "0.30.0"
egui-winit = "0.30.0"
egui-wgpu = "0.30.0"
egui_wgpu_backend = "0.33.0"
egui_winit_platform = "0.25.0"
pollster = "0.4.0"
